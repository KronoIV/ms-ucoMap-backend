# Reemplaza al application.properties de main durante las pruebas:
# nunca apunta a la base de datos de producción ni usa credenciales reales.
spring.application.name=ucomap-backend-test

spring.data.mongodb.uri=mongodb://localhost:27017/ucomap-test

app.data.init-on-startup=false

app.cors.allowed-origins=*

app.jwt.secret=test-secret-only-for-unit-tests-0123456789abcdef
app.jwt.expiration-ms=3600000

app.rate-limit.max-requests=1000
app.rate-limit.window-seconds=60
app.rate-limit.trusted-proxies=

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@ucomap.local
spring.mail.password=test

app.password-reset.token-expiry-minutes=60
app.password-reset.frontend-url=http://localhost:5173
app.password-reset.reset-path=/reset-password
app.password-reset.cooldown-minutes=1
app.password-reset.email-subject=Test reset

app.multiset.api-endpoint=http://localhost/multiset/
app.multiset.client-id=test
app.multiset.client-secret=test
app.multiset.map-set-code=TEST

logging.level.root=WARN
logging.level.co.edu.uco.ucomap=WARN
